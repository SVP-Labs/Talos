# Supply-chain guards (C27), the same every governed repository gets: a release waits
# a day before it can be installed, no dependency of a dependency comes from git or a
# tarball URL, and a package published with less provenance than before stops the install.
minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # The 2023 backport of a security fix to semver 6, published without the
  # provenance the 7.x releases carry; pulled in by @babel/core.
  - semver@6.3.1
  # Type declarations only, never executed; the 6.x line @types/node 22 wants was
  # published before undici's later releases gained provenance.
  - undici-types@6.21.0

# Stryker's Vitest runner predates Vitest 5, which joins a test's suites with " > "; without this
# the runner selects no tests for a mutant and every mutant survives. Drop it once a runner
# release supports Vitest 5.
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch

# Fixed releases of what dev tools pin to vulnerable ones.
overrides:
  markdownlint-cli2>markdown-it: 15.0.3
  markdownlint-cli2>smol-toml: 1.9.1
  # markdownlint 0.42.0, the newest, pins re2js 2.8.6, whose lookbehind matching takes quadratic
  # time; 2.8.7 fixes it.
  markdownlint>re2js: 2.8.7
  # micromark-extension-math asks for katex 0.16, and no 0.16 release has the fix; markdownlint
  # loads it for the math syntax only, never rendering with katex.
  micromark-extension-math>katex: 0.18.2
  typed-rest-client>qs: 6.16.1
