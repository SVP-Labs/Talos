# Publishes a release to npm when the owner pushes its tag. Only the owner can create v* tags
# (the tag ruleset); `build` also refuses a tag that isn't package.json's version or whose commit
# isn't on main. npm's trusted publishing authenticates `publish`, so no npm token is stored, and
# the provenance names this repository and the tagged commit, which every launcher checks. The
# OIDC permission sits on `publish` alone, which runs no dependency's code. Pins never move from
# here: the channel job, on main, moves them.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency: # a publish is never cancelled half way
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the tag
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a tag that isn't a release of main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version package.json)"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release: the tag is not vX.Y.Z" >&2; exit 1; }
          [[ "$TAG" == "v$version" ]] || { echo "release: the tag is not package.json's version" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main ||
            { echo "release: the tagged commit is not on main" >&2; exit 1; }
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      # The package ships npm-shrinkwrap.json, the tree pnpm-lock.yaml locked (overrides and the
      # release-age wait included), so npm installs exactly that tree wherever the release runs.
      # It comes from a hoisted install of the production dependencies, every platform's
      # optional packages included, which `talos shrinkwrap` checks against the lockfile.
      - name: Build and pack
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          tree="$RUNNER_TEMP/tree"
          mkdir -p "$tree"
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml "$tree/"
          cp -R patches "$tree/"
          printf '%s\n' '' 'nodeLinker: hoisted' 'supportedArchitectures:' \
            '  os: [linux, darwin, win32]' '  cpu: [x64, arm64]' '  libc: [glibc, musl]' \
            >> "$tree/pnpm-workspace.yaml"
          (cd "$tree" && pnpm install --prod --frozen-lockfile --ignore-scripts)
          TALOS_DEV=1 node dist/bin/talos.js shrinkwrap "$tree" --out npm-shrinkwrap.json
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
          tar -tzf "$RUNNER_TEMP"/package/*.tgz | grep -x 'package/npm-shrinkwrap.json' >/dev/null ||
            { echo "release: the package has no npm-shrinkwrap.json" >&2; exit 1; }
      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: talos-package
          path: ${{ runner.temp }}/package
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the run's own artifact
      id-token: write # npm's trusted publishing and the provenance it signs
    steps:
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24's own npm publishes through trusted publishing (npm 11.5.1 and later).
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Refuse an npm too old for trusted publishing
        run: |
          version="$(npm --version)"
          IFS=. read -r major minor patch <<<"$version"
          if ((major < 11 || (major == 11 && (minor < 5 || (minor == 5 && patch < 1))))); then
            echo "release: npm $version can't publish through trusted publishing" >&2
            exit 1
          fi
      - name: Collect the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: talos-package
          path: ${{ runner.temp }}/package
      - name: Publish with provenance
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/package/*.tgz)
          [[ ${#packages[@]} -eq 1 ]] || { echo "release: expected one package" >&2; exit 1; }
          npm publish "${packages[0]}" --provenance --access public --ignore-scripts
