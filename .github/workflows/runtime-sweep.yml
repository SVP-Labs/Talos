# The hourly runtime sweep (talos central sweep): every repository whose `talos` property names a
# channel, found through the organisation's custom properties, checked against the runtime
# vendors' feeds, with one p0 `security` issue per vulnerable runtime filed in that repository.
# The run is public, so no repository name passes through an expression: the matrix carries
# indices, each job has Talos look its repository up and mask the name before anything prints,
# and its token reaches that repository alone. The last job fails the run if any name shows up
# in the other jobs' logs anyway.
name: runtime-sweep

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions: {}

concurrency: # a sweep runs to the end; the next one waits
  group: runtime-sweep
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  list:
    name: list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      indices: ${{ steps.count.outputs.indices }}
    steps:
      - name: Mint talos-reviewer's token to read the organisation's custom properties
        id: listing
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TALOS_REVIEWER_APP_ID }}
          private-key: ${{ secrets.TALOS_REVIEWER_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-custom-properties: read
      - name: Count the repositories
        id: count
        env:
          GH_TOKEN: ${{ steps.listing.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          fail() {
            echo "list: $1" >&2
            exit 1
          }
          listing="$(gh api --paginate "orgs/$ORG/properties/values?per_page=100" 2>/dev/null)" ||
            fail "cannot list the organisation's repositories"
          total="$(jq -s -r 'add // [] | map(select(any(.properties[]?;
              .property_name == "talos" and (.value | IN("evaluate", "canary", "stable")))))
            | length' <<<"$listing" 2>/dev/null)" || fail "cannot read the listing"
          [[ "$total" =~ ^[0-9]+$ ]] || fail "the listing has no count"
          ((total <= 256)) || fail "more repositories than one matrix holds"
          printf 'indices=%s\n' "$(jq -cn --argjson n "$total" '[range(0; $n)]')" >> "$GITHUB_OUTPUT"
          echo "repositories: $total"

  sweep:
    name: sweep-${{ strategy.job-index }}
    needs: list
    if: ${{ needs.list.outputs.indices != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # this repository's rulesets, to find the release to run
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        index: ${{ fromJSON(needs.list.outputs.indices) }}
    steps:
      - name: Find the enforced Talos release
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TALOS_LOOKUP: ${{ vars.TALOS_LOOKUP }}
        run: |
          # bootstrap/find-pin.sh, inlined (Talos isn't checked out yet); a test keeps them equal.
          find_pin() {
            set -euo pipefail

            repo="${GITHUB_REPOSITORY:-}"
            talos="${TALOS_REPO:-SVP-Labs/Talos}"
            mode="${TALOS_LOOKUP:-rulesets}"
            sha_pattern='^[0-9a-f]{40}$'

            fail() {
              echo "find-pin: $1" >&2
              exit 1
            }

            by_rulesets() {
              local talos_id ids id detail shas count=0 pin=""
              talos_id="$(gh api "repos/$talos" 2>/dev/null | jq -r '.id')" ||
                fail "cannot read the Talos repository"
              ids="$(gh api --paginate "repos/$repo/rulesets?includes_parents=true" 2>/dev/null |
                jq -s -r 'add // [] | .[] | select(.enforcement != "disabled") | .id')" ||
                fail "cannot list the repository's rulesets"
              for id in $ids; do
                detail="$(gh api "repos/$repo/rulesets/$id?includes_parents=true" 2>/dev/null)" ||
                  fail "cannot read a ruleset"
                shas="$(jq -r --argjson talos "$talos_id" '
                  [.rules[]? | select(.type == "workflows") | .parameters.workflows[]?
                    | select(.repository_id == $talos) | (.sha // "none")] | unique | .[]' <<<"$detail")" ||
                  fail "cannot read a ruleset"
                [[ -z "$shas" ]] && continue
                count=$((count + 1))
                [[ "$shas" == *$'\n'* ]] && fail "a ruleset pins Talos at several commits"
                [[ "$shas" =~ $sha_pattern ]] || fail "a ruleset runs Talos at a ref, not a commit SHA"
                pin="$shas"
              done
              [[ "$count" -eq 0 ]] && fail "no ruleset that applies to this repository runs the Talos gate"
              [[ "$count" -gt 1 ]] && fail "$count Talos rulesets apply; exactly one must"
              printf '%s\n' "$pin"
            }

            by_channels() {
              local channel sha
              channel="$(gh api "repos/$repo" 2>/dev/null | jq -r '.custom_properties.talos // empty')" ||
                fail "cannot read the repository"
              case "$channel" in
                evaluate | canary | stable) ;;
                *) fail "the talos property names no channel" ;;
              esac
              sha="$(gh api -H 'Accept: application/vnd.github.raw' \
                "repos/$talos/contents/channels.json?ref=channels" 2>/dev/null |
                jq -r --arg channel "$channel" '.[$channel] // empty')" ||
                fail "cannot read channels.json"
              [[ "$sha" =~ $sha_pattern ]] || fail "channels.json has no commit for the channel"
              printf '%s\n' "$sha"
            }

            [[ -n "$repo" ]] || fail "GITHUB_REPOSITORY is not set"
            case "$mode" in
              rulesets) by_rulesets ;;
              channels) by_channels ;;
              *) fail "TALOS_LOOKUP must be rulesets or channels" ;;
            esac
          }
          pin="$(find_pin)"
          printf 'sha=%s\n' "$pin" >> "$GITHUB_OUTPUT"
      - name: Check out Talos at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.find.outputs.sha }}
          path: talos-kit
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Mint talos-reviewer's token to read the organisation's custom properties
        id: listing
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TALOS_REVIEWER_APP_ID }}
          private-key: ${{ secrets.TALOS_REVIEWER_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-custom-properties: read
      - name: Look the repository up by index and mask its name
        id: pick
        env:
          TALOS_PROPERTIES_TOKEN: ${{ steps.listing.outputs.token }}
          TALOS_ORG: ${{ github.repository_owner }}
          TALOS_INDEX: ${{ matrix.index }}
        run: node talos-kit/bootstrap/launch.ts central pick --json
      - name: Mint the sweep's token for that repository alone
        id: token
        if: ${{ steps.pick.outputs.names != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TALOS_REVIEWER_APP_ID }}
          private-key: ${{ secrets.TALOS_REVIEWER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pick.outputs.names }}
          permission-contents: read
          permission-issues: write
      - name: Sweep
        if: ${{ steps.pick.outputs.names != '' }}
        env:
          TALOS_REVIEWER_TOKEN: ${{ steps.token.outputs.token }}
          TALOS_ORG: ${{ github.repository_owner }}
          TALOS_OWNER: ${{ vars.TALOS_OWNER }}
          TALOS_THEA_APP: ${{ vars.TALOS_THEA_APP }}
          TALOS_REVIEWER_APP: ${{ vars.TALOS_REVIEWER_APP }}
          TALOS_RELEASE_APP: ${{ vars.TALOS_RELEASE_APP }}
        run: node talos-kit/bootstrap/launch.ts central sweep --json

  privacy:
    name: privacy
    needs: [list, sweep]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # this run's jobs and their logs
      contents: read # this repository's rulesets, to find the release to run
    steps:
      - name: Mint talos-reviewer's token to read the organisation's custom properties
        id: properties
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TALOS_REVIEWER_APP_ID }}
          private-key: ${{ secrets.TALOS_REVIEWER_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-custom-properties: read
      - name: Find the enforced Talos release
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TALOS_LOOKUP: ${{ vars.TALOS_LOOKUP }}
        run: |
          # bootstrap/find-pin.sh, inlined (Talos isn't checked out yet); a test keeps them equal.
          find_pin() {
            set -euo pipefail

            repo="${GITHUB_REPOSITORY:-}"
            talos="${TALOS_REPO:-SVP-Labs/Talos}"
            mode="${TALOS_LOOKUP:-rulesets}"
            sha_pattern='^[0-9a-f]{40}$'

            fail() {
              echo "find-pin: $1" >&2
              exit 1
            }

            by_rulesets() {
              local talos_id ids id detail shas count=0 pin=""
              talos_id="$(gh api "repos/$talos" 2>/dev/null | jq -r '.id')" ||
                fail "cannot read the Talos repository"
              ids="$(gh api --paginate "repos/$repo/rulesets?includes_parents=true" 2>/dev/null |
                jq -s -r 'add // [] | .[] | select(.enforcement != "disabled") | .id')" ||
                fail "cannot list the repository's rulesets"
              for id in $ids; do
                detail="$(gh api "repos/$repo/rulesets/$id?includes_parents=true" 2>/dev/null)" ||
                  fail "cannot read a ruleset"
                shas="$(jq -r --argjson talos "$talos_id" '
                  [.rules[]? | select(.type == "workflows") | .parameters.workflows[]?
                    | select(.repository_id == $talos) | (.sha // "none")] | unique | .[]' <<<"$detail")" ||
                  fail "cannot read a ruleset"
                [[ -z "$shas" ]] && continue
                count=$((count + 1))
                [[ "$shas" == *$'\n'* ]] && fail "a ruleset pins Talos at several commits"
                [[ "$shas" =~ $sha_pattern ]] || fail "a ruleset runs Talos at a ref, not a commit SHA"
                pin="$shas"
              done
              [[ "$count" -eq 0 ]] && fail "no ruleset that applies to this repository runs the Talos gate"
              [[ "$count" -gt 1 ]] && fail "$count Talos rulesets apply; exactly one must"
              printf '%s\n' "$pin"
            }

            by_channels() {
              local channel sha
              channel="$(gh api "repos/$repo" 2>/dev/null | jq -r '.custom_properties.talos // empty')" ||
                fail "cannot read the repository"
              case "$channel" in
                evaluate | canary | stable) ;;
                *) fail "the talos property names no channel" ;;
              esac
              sha="$(gh api -H 'Accept: application/vnd.github.raw' \
                "repos/$talos/contents/channels.json?ref=channels" 2>/dev/null |
                jq -r --arg channel "$channel" '.[$channel] // empty')" ||
                fail "cannot read channels.json"
              [[ "$sha" =~ $sha_pattern ]] || fail "channels.json has no commit for the channel"
              printf '%s\n' "$sha"
            }

            [[ -n "$repo" ]] || fail "GITHUB_REPOSITORY is not set"
            case "$mode" in
              rulesets) by_rulesets ;;
              channels) by_channels ;;
              *) fail "TALOS_LOOKUP must be rulesets or channels" ;;
            esac
          }
          pin="$(find_pin)"
          printf 'sha=%s\n' "$pin" >> "$GITHUB_OUTPUT"
      - name: Check out Talos at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.find.outputs.sha }}
          path: talos-kit
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Mask every repository name and find the canary
        id: canary
        env:
          TALOS_PROPERTIES_TOKEN: ${{ steps.properties.outputs.token }}
          TALOS_ORG: ${{ github.repository_owner }}
          # The canary's name as a SHA-256 digest: the name itself would print here.
          TALOS_PRIVACY_CANARY_SHA256: ${{ vars.TALOS_PRIVACY_CANARY_SHA256 }}
        run: node talos-kit/bootstrap/launch.ts central privacy --mask --json
      - name: Mint talos-reviewer's token for the canary alone
        id: reviewer
        if: ${{ steps.canary.outputs.name != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TALOS_REVIEWER_APP_ID }}
          private-key: ${{ secrets.TALOS_REVIEWER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.canary.outputs.name }}
          permission-metadata: read
      - name: Search this run's logs for repository names
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TALOS_PROPERTIES_TOKEN: ${{ steps.properties.outputs.token }}
          TALOS_ORG: ${{ github.repository_owner }}
          TALOS_REVIEWER_TOKEN: ${{ steps.reviewer.outputs.token }}
          TALOS_PRIVACY_JOB: privacy
          # The canary's name as a SHA-256 digest: the name itself would print here.
          TALOS_PRIVACY_CANARY_SHA256: ${{ vars.TALOS_PRIVACY_CANARY_SHA256 }}
        run: node talos-kit/bootstrap/launch.ts central privacy --json
