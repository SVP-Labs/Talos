# The weekly drift report (talos central drift): every repository talos-release is installed on,
# compared with what `talos govern` sets, with one `drift` issue per difference filed in that
# repository (and closed once the difference is gone). It reads as talos-release (administration
# read) and files as talos-reviewer (issues write), each token limited to the one repository. In
# the channels.json lookup it also checks the file against the rulesets. The run is public: the
# matrix carries indices, names are masked before anything prints, and the last job fails the run
# if any name shows up in the logs anyway.
name: drift

on:
  schedule:
    - cron: '29 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency: # zizmor: ignore[concurrency-limits] a report runs to the end; the next one waits
  group: drift
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  list:
    name: list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions: {}
    outputs:
      indices: ${{ steps.count.outputs.indices }}
    steps:
      - name: Mint a metadata-only token of talos-release
        id: listing
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TALOS_RELEASE_APP_ID }}
          private-key: ${{ secrets.TALOS_RELEASE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] metadata only: lists the installation's repositories
          permission-metadata: read
      - name: Count the repositories
        id: count
        env:
          GH_TOKEN: ${{ steps.listing.outputs.token }}
        run: |
          set -euo pipefail
          fail() {
            echo "list: $1" >&2
            exit 1
          }
          total="$(gh api 'installation/repositories?per_page=1' 2>/dev/null |
            jq -r '.total_count' 2>/dev/null)" || fail "cannot count the installation's repositories"
          [[ "$total" =~ ^[0-9]+$ ]] || fail "the listing has no count"
          ((total <= 256)) || fail "more repositories than one matrix holds"
          printf 'indices=%s\n' "$(jq -cn --argjson n "$total" '[range(0; $n)]')" >> "$GITHUB_OUTPUT"
          echo "repositories: $total"

  drift:
    name: drift-${{ strategy.job-index }}
    needs: list
    if: ${{ needs.list.outputs.indices != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read # this repository's rulesets, to find the release to run
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        index: ${{ fromJSON(needs.list.outputs.indices) }}
    steps:
      - name: Mint a metadata-only token of talos-release
        id: listing
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TALOS_RELEASE_APP_ID }}
          private-key: ${{ secrets.TALOS_RELEASE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] metadata only: lists the installation's repositories
          permission-metadata: read
      - name: Look the repository up by index and mask its name
        id: pick
        env:
          GH_TOKEN: ${{ steps.listing.outputs.token }}
          INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          fail() {
            echo "pick: $1" >&2
            exit 1
          }
          [[ "${INDEX:-}" =~ ^[0-9]+$ ]] || fail "no index"
          listing="$(gh api --paginate installation/repositories 2>/dev/null)" ||
            fail "cannot list the installation's repositories"
          line="$(jq -s -r --argjson i "$INDEX" \
            '[.[].repositories[]] | sort_by(.id) | .[$i] // empty | "\(.full_name) \(.name)"' \
            <<<"$listing" 2>/dev/null)" || fail "cannot read the listing"
          if [[ -z "$line" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "pick: the listing changed and has no such index; nothing to do"
            exit 0
          fi
          full="${line%% *}"
          name="${line##* }"
          echo "::add-mask::$full"
          echo "::add-mask::$name"
          {
            echo "skip=false"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
      - name: Mint talos-release's reading token for that repository alone
        id: read
        if: ${{ steps.pick.outputs.skip == 'false' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TALOS_RELEASE_APP_ID }}
          private-key: ${{ secrets.TALOS_RELEASE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pick.outputs.name }}
          permission-administration: read
      - name: Mint talos-reviewer's filing token for that repository alone
        id: file
        if: ${{ steps.pick.outputs.skip == 'false' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TALOS_REVIEWER_APP_ID }}
          private-key: ${{ secrets.TALOS_REVIEWER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pick.outputs.name }}
          permission-contents: read
          permission-issues: write
      - name: Find the enforced Talos release
        id: find
        if: ${{ steps.pick.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TALOS_LOOKUP: ${{ vars.TALOS_LOOKUP }}
        run: |
          # bootstrap/find-pin.sh, inlined (Talos isn't checked out yet); a test keeps them equal.
          find_pin() {
            set -euo pipefail

            repo="${GITHUB_REPOSITORY:-}"
            talos="${TALOS_REPO:-SVP-Labs/Talos}"
            mode="${TALOS_LOOKUP:-rulesets}"
            sha_pattern='^[0-9a-f]{40}$'

            fail() {
              echo "find-pin: $1" >&2
              exit 1
            }

            api() {
              gh api "$@" 2>/dev/null
            }

            by_rulesets() {
              local talos_id ids id detail shas count=0 pin=""
              talos_id="$(api "repos/$talos" | jq -r '.id')" || fail "cannot read the Talos repository"
              ids="$(api --paginate "repos/$repo/rulesets?includes_parents=true" |
                jq -s -r 'add // [] | .[] | select(.enforcement != "disabled") | .id')" ||
                fail "cannot list the repository's rulesets"
              for id in $ids; do
                detail="$(api "repos/$repo/rulesets/$id?includes_parents=true")" || fail "cannot read a ruleset"
                shas="$(jq -r --argjson talos "$talos_id" '
                  [.rules[]? | select(.type == "workflows") | .parameters.workflows[]?
                    | select(.repository_id == $talos) | (.sha // "none")] | unique | .[]' <<<"$detail")" ||
                  fail "cannot read a ruleset"
                [[ -z "$shas" ]] && continue
                count=$((count + 1))
                [[ "$shas" == *$'\n'* ]] && fail "a ruleset pins Talos at several commits"
                [[ "$shas" =~ $sha_pattern ]] || fail "a ruleset runs Talos at a ref, not a commit SHA"
                pin="$shas"
              done
              [[ "$count" -eq 0 ]] && fail "no ruleset that applies to this repository runs the Talos gate"
              [[ "$count" -gt 1 ]] && fail "$count Talos rulesets apply; exactly one must"
              printf '%s\n' "$pin"
            }

            by_channels() {
              local channel sha
              channel="$(api "repos/$repo" | jq -r '.custom_properties.talos // empty')" ||
                fail "cannot read the repository"
              case "$channel" in
                evaluate | canary | stable) ;;
                *) fail "the talos property names no channel" ;;
              esac
              sha="$(api "repos/$talos/contents/channels.json?ref=channels" |
                jq -r --arg channel "$channel" '.content | @base64d | fromjson | .[$channel] // empty')" ||
                fail "cannot read channels.json"
              [[ "$sha" =~ $sha_pattern ]] || fail "channels.json has no commit for the channel"
              printf '%s\n' "$sha"
            }

            [[ -n "$repo" ]] || fail "GITHUB_REPOSITORY is not set"
            case "$mode" in
              rulesets) by_rulesets ;;
              channels) by_channels ;;
              *) fail "TALOS_LOOKUP must be rulesets or channels" ;;
            esac
          }
          pin="$(find_pin)"
          printf 'sha=%s\n' "$pin" >> "$GITHUB_OUTPUT"
      - name: Check out Talos at the pin
        if: ${{ steps.pick.outputs.skip == 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.find.outputs.sha }}
          path: talos-kit
          persist-credentials: false
      - name: Set up Node
        if: ${{ steps.pick.outputs.skip == 'false' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Report drift
        if: ${{ steps.pick.outputs.skip == 'false' }}
        env:
          TALOS_RELEASE_TOKEN: ${{ steps.read.outputs.token }}
          TALOS_REVIEWER_TOKEN: ${{ steps.file.outputs.token }}
          TALOS_ORG: ${{ github.repository_owner }}
          TALOS_OWNER: ${{ vars.TALOS_OWNER || 'SvenPGH' }}
          TALOS_THEA_APP: ${{ vars.TALOS_THEA_APP || 'thea-svp' }}
          TALOS_REVIEWER_APP: ${{ vars.TALOS_REVIEWER_APP || 'talos-reviewer' }}
          TALOS_RELEASE_APP: ${{ vars.TALOS_RELEASE_APP || 'talos-release' }}
        run: node talos-kit/bootstrap/launch.mjs central drift --json

  channels-file:
    name: channels-file
    if: ${{ vars.TALOS_LOOKUP == 'channels' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read # this repository's rulesets, to find the release to run
    steps:
      - name: Mint talos-release's token to read the organisation's rulesets
        id: read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TALOS_RELEASE_APP_ID }}
          private-key: ${{ secrets.TALOS_RELEASE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] reads the org's channel rulesets
          permission-organization-administration: read
      - name: Mint talos-reviewer's filing token for this repository
        id: file
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TALOS_REVIEWER_APP_ID }}
          private-key: ${{ secrets.TALOS_REVIEWER_KEY }}
          permission-contents: read
          permission-issues: write
      - name: Find the enforced Talos release
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TALOS_LOOKUP: ${{ vars.TALOS_LOOKUP }}
        run: |
          # bootstrap/find-pin.sh, inlined (Talos isn't checked out yet); a test keeps them equal.
          find_pin() {
            set -euo pipefail

            repo="${GITHUB_REPOSITORY:-}"
            talos="${TALOS_REPO:-SVP-Labs/Talos}"
            mode="${TALOS_LOOKUP:-rulesets}"
            sha_pattern='^[0-9a-f]{40}$'

            fail() {
              echo "find-pin: $1" >&2
              exit 1
            }

            api() {
              gh api "$@" 2>/dev/null
            }

            by_rulesets() {
              local talos_id ids id detail shas count=0 pin=""
              talos_id="$(api "repos/$talos" | jq -r '.id')" || fail "cannot read the Talos repository"
              ids="$(api --paginate "repos/$repo/rulesets?includes_parents=true" |
                jq -s -r 'add // [] | .[] | select(.enforcement != "disabled") | .id')" ||
                fail "cannot list the repository's rulesets"
              for id in $ids; do
                detail="$(api "repos/$repo/rulesets/$id?includes_parents=true")" || fail "cannot read a ruleset"
                shas="$(jq -r --argjson talos "$talos_id" '
                  [.rules[]? | select(.type == "workflows") | .parameters.workflows[]?
                    | select(.repository_id == $talos) | (.sha // "none")] | unique | .[]' <<<"$detail")" ||
                  fail "cannot read a ruleset"
                [[ -z "$shas" ]] && continue
                count=$((count + 1))
                [[ "$shas" == *$'\n'* ]] && fail "a ruleset pins Talos at several commits"
                [[ "$shas" =~ $sha_pattern ]] || fail "a ruleset runs Talos at a ref, not a commit SHA"
                pin="$shas"
              done
              [[ "$count" -eq 0 ]] && fail "no ruleset that applies to this repository runs the Talos gate"
              [[ "$count" -gt 1 ]] && fail "$count Talos rulesets apply; exactly one must"
              printf '%s\n' "$pin"
            }

            by_channels() {
              local channel sha
              channel="$(api "repos/$repo" | jq -r '.custom_properties.talos // empty')" ||
                fail "cannot read the repository"
              case "$channel" in
                evaluate | canary | stable) ;;
                *) fail "the talos property names no channel" ;;
              esac
              sha="$(api "repos/$talos/contents/channels.json?ref=channels" |
                jq -r --arg channel "$channel" '.content | @base64d | fromjson | .[$channel] // empty')" ||
                fail "cannot read channels.json"
              [[ "$sha" =~ $sha_pattern ]] || fail "channels.json has no commit for the channel"
              printf '%s\n' "$sha"
            }

            [[ -n "$repo" ]] || fail "GITHUB_REPOSITORY is not set"
            case "$mode" in
              rulesets) by_rulesets ;;
              channels) by_channels ;;
              *) fail "TALOS_LOOKUP must be rulesets or channels" ;;
            esac
          }
          pin="$(find_pin)"
          printf 'sha=%s\n' "$pin" >> "$GITHUB_OUTPUT"
      - name: Check out Talos at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.find.outputs.sha }}
          path: talos-kit
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Compare channels.json with the rulesets
        env:
          TALOS_RELEASE_TOKEN: ${{ steps.read.outputs.token }}
          TALOS_REVIEWER_TOKEN: ${{ steps.file.outputs.token }}
          TALOS_ORG: ${{ github.repository_owner }}
          TALOS_OWNER: ${{ vars.TALOS_OWNER || 'SvenPGH' }}
          TALOS_THEA_APP: ${{ vars.TALOS_THEA_APP || 'thea-svp' }}
          TALOS_REVIEWER_APP: ${{ vars.TALOS_REVIEWER_APP || 'talos-reviewer' }}
          TALOS_RELEASE_APP: ${{ vars.TALOS_RELEASE_APP || 'talos-release' }}
        run: node talos-kit/bootstrap/launch.mjs central drift --channels-file --json

  privacy:
    name: privacy
    needs: [list, drift, channels-file]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read # this run's jobs and their logs
      contents: read # this repository's rulesets, to find the release to run
    steps:
      - name: Mint a metadata-only token of talos-release
        id: release
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TALOS_RELEASE_APP_ID }}
          private-key: ${{ secrets.TALOS_RELEASE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] metadata only: lists the installation's repositories
          permission-metadata: read
      - name: Mint a metadata-only token of talos-reviewer
        id: reviewer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TALOS_REVIEWER_APP_ID }}
          private-key: ${{ secrets.TALOS_REVIEWER_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] metadata only: lists the installation's repositories
          permission-metadata: read
      - name: Find the enforced Talos release
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TALOS_LOOKUP: ${{ vars.TALOS_LOOKUP }}
        run: |
          # bootstrap/find-pin.sh, inlined (Talos isn't checked out yet); a test keeps them equal.
          find_pin() {
            set -euo pipefail

            repo="${GITHUB_REPOSITORY:-}"
            talos="${TALOS_REPO:-SVP-Labs/Talos}"
            mode="${TALOS_LOOKUP:-rulesets}"
            sha_pattern='^[0-9a-f]{40}$'

            fail() {
              echo "find-pin: $1" >&2
              exit 1
            }

            api() {
              gh api "$@" 2>/dev/null
            }

            by_rulesets() {
              local talos_id ids id detail shas count=0 pin=""
              talos_id="$(api "repos/$talos" | jq -r '.id')" || fail "cannot read the Talos repository"
              ids="$(api --paginate "repos/$repo/rulesets?includes_parents=true" |
                jq -s -r 'add // [] | .[] | select(.enforcement != "disabled") | .id')" ||
                fail "cannot list the repository's rulesets"
              for id in $ids; do
                detail="$(api "repos/$repo/rulesets/$id?includes_parents=true")" || fail "cannot read a ruleset"
                shas="$(jq -r --argjson talos "$talos_id" '
                  [.rules[]? | select(.type == "workflows") | .parameters.workflows[]?
                    | select(.repository_id == $talos) | (.sha // "none")] | unique | .[]' <<<"$detail")" ||
                  fail "cannot read a ruleset"
                [[ -z "$shas" ]] && continue
                count=$((count + 1))
                [[ "$shas" == *$'\n'* ]] && fail "a ruleset pins Talos at several commits"
                [[ "$shas" =~ $sha_pattern ]] || fail "a ruleset runs Talos at a ref, not a commit SHA"
                pin="$shas"
              done
              [[ "$count" -eq 0 ]] && fail "no ruleset that applies to this repository runs the Talos gate"
              [[ "$count" -gt 1 ]] && fail "$count Talos rulesets apply; exactly one must"
              printf '%s\n' "$pin"
            }

            by_channels() {
              local channel sha
              channel="$(api "repos/$repo" | jq -r '.custom_properties.talos // empty')" ||
                fail "cannot read the repository"
              case "$channel" in
                evaluate | canary | stable) ;;
                *) fail "the talos property names no channel" ;;
              esac
              sha="$(api "repos/$talos/contents/channels.json?ref=channels" |
                jq -r --arg channel "$channel" '.content | @base64d | fromjson | .[$channel] // empty')" ||
                fail "cannot read channels.json"
              [[ "$sha" =~ $sha_pattern ]] || fail "channels.json has no commit for the channel"
              printf '%s\n' "$sha"
            }

            [[ -n "$repo" ]] || fail "GITHUB_REPOSITORY is not set"
            case "$mode" in
              rulesets) by_rulesets ;;
              channels) by_channels ;;
              *) fail "TALOS_LOOKUP must be rulesets or channels" ;;
            esac
          }
          pin="$(find_pin)"
          printf 'sha=%s\n' "$pin" >> "$GITHUB_OUTPUT"
      - name: Check out Talos at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.find.outputs.sha }}
          path: talos-kit
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Search this run's logs for repository names
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TALOS_RELEASE_TOKEN: ${{ steps.release.outputs.token }}
          TALOS_REVIEWER_TOKEN: ${{ steps.reviewer.outputs.token }}
          TALOS_PRIVACY_JOB: privacy
          # The canary's name as a SHA-256 digest: the name itself would print here.
          TALOS_PRIVACY_CANARY_SHA256: ${{ vars.TALOS_PRIVACY_CANARY_SHA256 }}
        run: node talos-kit/bootstrap/launch.mjs central privacy --json
