# Generated by Talos 0.1.5. Do not edit.
# Spelling in docs, code, scripts and CI, in British or American English. Words the
# dictionaries don't know go in .cspell/words.txt, one per line.
version: '0.2'
language: en,en-GB
dictionaryDefinitions:
  - name: project
    path: ./.cspell/words.txt
    addWords: true
dictionaries: [project]
words: [talos]
ignoreRegExpList:
  - '/<!-- talos:begin -->[\s\S]*?<!-- talos:end -->/g'
