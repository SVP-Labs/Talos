  - '/sha256:[0-9a-f]{64}/g'
  - '/\b[0-9a-f]{40}\b/g'
  - '/\[[A-Za-z0-9#^-]{8,}\]/g'
  - '/xǁ[\wǁ]*/gu'
ignorePaths:
  - '**/node_modules/**'
  - '**/.talos/**'
  - '**/coverage/**'
  - '**/reports/**'
  - '**/.stryker-tmp/**'
  - '.cspell/**'
  - '**/pnpm-lock.yaml'
  - '**/*.lock'
  - 'test-projects'
  - 'test-projects/**'
  - 'src/version/fixtures'
  - 'src/version/fixtures/**'
