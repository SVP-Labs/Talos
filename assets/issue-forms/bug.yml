name: Bug
description: 'Something is broken'
labels: ['bug']
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 'What correct behaviour looks like once this is fixed.'
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: 'The steps that show the bug, from a clean start.'
    validations: { required: true }
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected / Actual
      description: 'What should happen, and what happens instead.'
    validations: { required: true }
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: 'One to five testable checkboxes; more means the issue should be split. One of them is a test that fails before the fix.'
      value: |
        - [ ]
    validations: { required: true }
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: 'What this ticket leaves alone, so the work stays one PR.'
    validations: { required: true }
  - type: textarea
    id: affected-areas
    attributes:
      label: Affected areas
      description: >-
        What this ticket may touch, one item per line. Name a file exactly as - `path/to/file`;
        for chores and debt, Talos's review holds the PR to the files named here.
    validations: { required: true }
