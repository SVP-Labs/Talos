name: Spike
description: 'A time-boxed question, answered rather than shipped'
labels: ['spike']
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 'The question, the decision its answer unblocks, and the time box.'
    validations: { required: true }
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: 'One to five testable checkboxes; more means the issue should be split.'
      value: |
        - [ ] The findings are posted as a comment on this issue
    validations: { required: true }
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: 'What this ticket leaves alone, so the work stays one PR.'
    validations: { required: true }
  - type: textarea
    id: affected-areas
    attributes:
      label: Affected areas
      description: >-
        What this ticket may touch, one item per line. Name a file exactly as - `path/to/file`;
        for chores and debt, Talos's review holds the PR to the files named here.
    validations: { required: true }
